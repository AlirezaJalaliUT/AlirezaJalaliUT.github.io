heading: About the Professor
lead: Alireza Jalali is an Associate Professor in the School of Mechanical Engineering at the University of Tehran.
body: 'His research spans computational fluid dynamics, optimization, and sustainable water treatment. Current topics
  reflected in published work include ultraviolet disinfection, photoreactor design, membrane and thermal desalination,
  and data-driven approaches to system performance.


  This overview is based on publicly available affiliation and publication records. A full biography, selected appointments,
  and educational history should be reviewed and approved by the professor before publication.'
education: ''
research_statement: Combining fundamental fluid mechanics with practical purification and desalination challenges.
